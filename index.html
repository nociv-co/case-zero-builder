<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Site Created & Designed by Jasilyn A. Anderson | NOCIV.CO -->
<title>Case Zero Builder | NOCIV</title>
<meta name="description" content="Build your own device. Pick what you want to make, see the real cost, prototype it, and print its body.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="case-zero.css">
</head>
<body>
  <header class="top">
    <div class="topInner">
      <a class="brand" href="https://nociv.co">NOCIV</a>
      <span class="product">Case Zero <span>Builder</span></span>
      <span class="version">v0.8</span>
      <div class="topTools"><button class="meterBtn" id="meterBtn" aria-label="Build progress"><span class="mBar"><i></i></span><span class="mPct">0%</span></button><button class="learnBtn" id="learnBtn">Learn</button><button class="lvlBtn" id="lvlBtn">Level</button></div>
    </div>
    <nav class="steps" id="steps" aria-label="Build steps"></nav>
  </header>

  <main class="wrap">
    <section class="view" id="v-make"></section>
    <section class="view" id="v-circuit"></section>
    <section class="view" id="v-parts"></section>
    <section class="view" id="v-proto"></section>
    <section class="view" id="v-body"></section>
    <section class="view" id="v-sim"></section>
    <section class="view" id="v-save"></section>
  </main>

  <footer class="navBar">
    <div class="navInner">
      <button class="btn ghost" id="backBtn">Back</button>
      <button class="btn primary" id="nextBtn">Next</button>
    </div>
  </footer>
  <div class="mode" id="mode" hidden>
    <div class="mTop">
      <button class="mExit" id="mExit">Done</button>
      <div class="mTitle"></div>
      <div class="mTopR"></div>
    </div>
    <div class="mBody">
      <aside class="mRail" aria-label="Parts tray"></aside>
      <div class="mStage"></div>
      <aside class="mSheet" aria-live="polite"></aside>
    </div>
  </div>
  <div class="qpop" id="qpop" hidden><div class="qBack"></div><div class="qCard" role="dialog" aria-modal="true"></div></div>
  <div class="learn" id="learn" hidden>
    <div class="lTop"><button class="mExit" id="learnExit">Done</button><b>Learn</b><span class="small">How it all works, in plain words</span></div>
    <div class="lBody" id="learnBody"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <div class="lvl" id="lvl" hidden><div class="lvlInner"><div class="eyebrow">Case Zero Builder</div><h1>What's your level?</h1><p class="lead">No wrong answer. It changes how much we explain. You can switch any time.</p><div class="lvlGrid" id="lvlGrid"></div></div></div>
  <canvas class="confetti" id="confetti" hidden></canvas>
  <script src="nociv-card.js"></script>
  <script src="case-zero-data.js"></script>
  <script src="case-zero.js"></script>
</body>
</html>
